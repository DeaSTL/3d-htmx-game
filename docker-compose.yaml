services:
  game-dev:
    profiles:
      - dev
    stop_signal: SIGKILL
    ports:
      - 3000:3000
    build:
      dockerfile: Dockerfile
      context: ./
    develop:
      watch:
        - action: rebuild
          path: ./
  game-prd:
    image: yeahscience/htmx-3d
    profiles:
      - prd
    stop_signal: SIGKILL
    platform: linux/arm64,linux/amd64
    ports:
      - 3000:3000
    build:
      dockerfile: Dockerfile
      context: ./
