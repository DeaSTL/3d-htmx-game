{{define "playerSync"}}
<div id="other_players" style="transform-style: preserve-3d; position: absolute; width:100%; height: 100%">
  {{range .Players}}
    {{if and (ne .ID $.PlayerID) (not .Exited)}}
      {{template "otherPlayer" dict "ID" .ID "X" (int .Position.X) "Y" (int .Position.Z)}}
    {{end}}
  {{end}}
</div>
{{end}}
